name: CI / Automotive SIL Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linux GUI & CAN dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            can-utils \
            xvfb || true

      - name: Set up Linux Virtual CAN interface (vcan0)
        if: runner.os == 'Linux'
        run: |
          sudo modprobe vcan 2>/dev/null || echo "vcan kernel module not available in container; falling back to IPC bus"
          sudo ip link add dev vcan0 type vcan 2>/dev/null || true
          sudo ip link set up vcan0 2>/dev/null || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate CAN DBC syntax & integrity
        run: |
          python -c "import cantools; db = cantools.database.load_file('automotive_network.dbc'); assert 'PowertrainTelemetry' in [m.name for m in db.messages]; assert 'VehicleDiagnostics' in [m.name for m in db.messages]; print('DBC specification valid.')"

      - name: Run Test Suite (Headless Offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest test_cluster.py
