[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-sil-cockpit"
version = "1.0.0"
description = "Tier-1 Automotive Software-in-the-Loop CAN Digital Instrument Cluster & ECU Simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shovan Bhattacharya", email = "shovanbhattacharya69@gmail.com" }
]
keywords = [
    "automotive",
    "can-bus",
    "socketcan",
    "instrument-cluster",
    "pyqt6",
    "visteon",
    "smartcore",
    "sil",
    "ecu-simulation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-can>=4.3.0",
    "cantools>=39.4.0",
    "PyQt6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
cluster = "run:main"
cluster-ecu = "ecu_core:main"
cluster-display = "cockpit_display:main"
